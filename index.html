<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI-1 App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="main-body">
    <!-- 上部のタブ。ボタンは下の PAGES から自動で作られます -->
    <nav class="tabs" id="tabs"></nav>
    <iframe id="content-frame" title="content" allow="microphone; hid"></iframe>

    <script type="module">
        import { comm } from './js/comm/comm.js';
        window.comm = comm;     // 各ページから window.parent.comm で使う

        // ==========================================
        // タブの一覧。ページを増やすときはここに1行足すだけ
        //   id     : ページからタブを指定するときの名前 (window.parent.showPageById('tab-step1'))
        //   hidden : true にすると最初は隠しておき、window.parent.unlockTab(id) で表示する
        //   resetOnLeave : true にすると、このページから別のタブへ移るときにリセット命令 [248, 240, 8] を送る
        // ==========================================
        const PAGES = [
            { url: 'pages/step0.html', label: 'STEP0', sub: '導入',       id: 'tab-step0' },
            { url: 'pages/step1.html', label: 'STEP1', sub: '光を作ろう', id: 'tab-step1', resetOnLeave: true },
            { url: 'pages/step2.html', label: 'STEP2', sub: '順次処理',   id: 'tab-step2' },
            { url: 'pages/step3.html', label: 'STEP3', sub: '反復処理',   id: 'tab-step3' },
            { url: 'pages/step4.html', label: 'STEP4', sub: '分岐処理',   id: 'tab-step4' },
            { url: 'pages/step5.html', label: 'STEP5', sub: '総合',       id: 'tab-step5' },
            { url: 'pages/step6.html', label: 'STEP6', sub: 'チャレンジ', id: 'tab-step6' },
        ];

        const tabsEl = document.getElementById('tabs');
        const frame = document.getElementById('content-frame');
        const buttons = PAGES.map((p, i) => {
            const b = document.createElement('button');
            b.className = 'tab-btn';
            b.id = p.id;
            if (p.hidden) b.style.display = 'none';
            b.innerHTML = `${p.label}<br>${p.sub}`;
            b.addEventListener('click', () => showPage(i));
            tabsEl.appendChild(b);
            return b;
        });

        // 隠しタブを表示する (例: window.parent.unlockTab('tab-step3'))
        window.unlockTab = function(id) {
            const el = document.getElementById(id);
            if (el) el.style.display = 'inline-block';
        };

        let currentPage = -1;
        function showPage(i) {
            const prev = PAGES[currentPage];
            if (prev && prev.resetOnLeave && i !== currentPage) {
                comm.sendLed(8);   // マイコンをリセット (未接続なら何もしない)
            }
            currentPage = i;
            buttons.forEach((b, k) => b.classList.toggle('active', k === i));
            frame.src = PAGES[i].url;
        }

        // ページ側から他のタブへ移動したいとき: window.parent.showPageById('tab-step2')
        window.showPageById = function(id) {
            const i = PAGES.findIndex(p => p.id === id);
            if (i < 0) return;
            window.unlockTab(id);
            showPage(i);
        };

        // ==========================================
        // 受信データ・状態を、表示中のページへ通知する
        // ==========================================
        function forward(type, detail) {
            const w = frame.contentWindow;
            if (!w) return;
            try { w.dispatchEvent(new w.CustomEvent(type, { detail })); } catch (e) { /* ページ読み込み中 */ }
        }
        comm.addEventListener('byte',       (e) => forward('comm-byte', e.detail));
        comm.addEventListener('report',     (e) => forward('comm-report', e.detail));
        comm.addEventListener('frameError', (e) => forward('comm-frame-error', e.detail));
        comm.addEventListener('status',     (e) => forward('comm-status', e.detail));
        comm.addEventListener('tone',       (e) => forward('comm-tone', e.detail));

        // 常に先頭のタブから開く
        showPage(0);
    </script>
</body>
</html>
