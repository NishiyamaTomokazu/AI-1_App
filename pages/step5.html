<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-1 App - STEP5</title>
<link rel="stylesheet" href="../css/style.css">
<!-- Blocklyのライブラリ (CDNだと読み込めないことがあるため、同梱) -->
<script src="../vendor/blockly.min.js"></script>
</head>
<body class="iframe-body">

<div class="top-controls prog">
    <span class="mini-status">[ <span id="device-status">未接続</span> ]</span>
</div>

<div class="app-container prog">
    <div class="panel-header">
        <h2>🏆 STEP5 総合</h2>
        <p>
            作成したプログラムを転送、実行するとAIクロックが動きます。<br>
            緑色のボタンを押すとサンプルプログラムが表示されるので、どのように動くか試してください。
        </p>
    </div>

    <!-- 左にボタン6つ (2列×3段)、右に説明文 (ボタンを押すごとに変わる) -->
    <div class="prog-controls">
        <div class="prog-buttons">
            <button class="prog-btn transfer" id="transfer-btn">🚀 プログラム転送</button>
            <button class="prog-btn sample" id="sample1-btn">🏆 サンプル1</button>
            <button class="prog-btn run" id="run-btn">▶ プログラム実行</button>
            <button class="prog-btn sample" id="sample2-btn">🏆 サンプル2</button>
            <button class="prog-btn save" id="save-btn">💾 プログラム保存</button>
            <button class="prog-btn load" id="load-btn">📂 プログラム読み込み</button>
        </div>
        <!-- 「プログラム読み込み」で開くファイル選択 (画面には出さない) -->
        <input type="file" id="load-file" accept=".json,application/json" style="display: none">
        <!-- 枠は flex なので、<br> で改行するときは span で包む -->
        <div class="prog-message" id="prog-message"><span>左の「LED」をクリックするとブロックが表示されます<br>ブロックを組み合わせてプログラムを作ろう</span></div>
    </div>

    <!-- ツールエリア (左) のタブと、それぞれに並べるブロック -->
    <xml id="toolbox" style="display: none">
        <category name="LED" colour="230">
            <block type="cmd_led">
                <field name="COLOR">red</field>
                <field name="TIME">1</field>
            </block>
            <block type="cmd_led_fade">
                <field name="COLOR">red</field>
                <field name="FADE">in</field>
            </block>
            <block type="cmd_led_conti">
                <field name="COLOR">red</field>
            </block>
            <block type="cmd_led_off"></block>
            <block type="cmd_backlight">
                <field name="TIME">1</field>
            </block>
            <block type="cmd_backlight_conti"></block>
            <block type="cmd_backlight_off"></block>
        </category>
        <category name="制御" colour="#e69500">
            <!-- プログラムエリアに置けるのは1つだけ (step5.js の maxInstances)。置いてあるときは灰色になる -->
            <block type="cmd_start"></block>
            <block type="cmd_loop">
                <field name="COUNT">3</field>
            </block>
            <block type="cmd_if"></block>
            <block type="cmd_if_else"></block>
            <block type="cond_switch_on"></block>
            <block type="cond_switch_off"></block>
        </category>
        <category name="センサ" colour="210">
            <block type="cmd_wait_sound"></block>
            <block type="cmd_wait_switch"></block>
        </category>
        <category name="タイマー" colour="#00bcd4">
            <block type="cmd_wait_timer">
                <field name="T">1</field>
            </block>
            <block type="cmd_wait_timer_or_sound">
                <field name="T">1</field>
            </block>
            <block type="cmd_wait_timer_or_switch">
                <field name="T">1</field>
            </block>
        </category>
        <category name="サウンド" colour="#ab47bc">
            <block type="cmd_sound1"></block>
            <block type="cmd_sound2"></block>
            <block type="cmd_sound3"></block>
            <block type="cmd_music"></block>
        </category>
    </xml>

    <!-- 左がツールエリア、右がプログラムエリア -->
    <div id="blocklyDiv" class="prog-area"></div>

    <p class="outro-text prog-next" onclick="goToNext()">
        STEP6 へ進もう 👉
    </p>
</div>

<script src="../js/blockly_config.js"></script>
<script src="../js/step5.js"></script>
</body>
</html>
